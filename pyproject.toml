# file: pyproject.toml
# Purpose: Python package specification and entrypoint configuration for ard26 CLI
# Target OS: Ubuntu 24.04 / 26.04 LTS (WSL2) + Windows 11 Host

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arduino26-tools"
version = "0.1.0"
description = "Convenience CLI and Serial Telemetry Tooling for Arduino26"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "fekerr & Antigravity AI Team" }
]
dependencies = [
    "pyserial>=3.5"
]

[project.scripts]
ard26 = "ard26_cli.cli:main"

[tool.setuptools.packages.find]
where = ["dev-tools"]

# file pyproject.toml ends
